name: Native sensor app

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test native signal analysis
        run: swift test --package-path native
      - name: Compile iPhone app without signing
        run: >-
          xcodebuild -project native/TableSignalNative.xcodeproj
          -scheme TableSignal -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath native/DerivedData
          CODE_SIGNING_ALLOWED=NO build
